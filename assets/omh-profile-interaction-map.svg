<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" aria-labelledby="title desc" role="img" viewBox="0 0 1200 700"><title id="title">OMH request-to-handoff interaction map</title><desc id="desc">A plain Hermes request flows through OMH routing into a prepared handoff, then only moves to observed status after wrapper or runtime evidence is recorded.</desc><defs><style>text{font-family:Arial,Helvetica,sans-serif}.bg{fill:#f8fafc}.title{font-size:34px;font-weight:700;fill:#111827}.subtitle{font-size:17px;fill:#4b5563}.card{fill:#fff;stroke:#d7dee8;stroke-width:2}.card-blue{fill:#eff6ff;stroke:#93c5fd}.card-amber,.card-blue,.card-green{stroke-width:2}.card-green{fill:#ecfdf5;stroke:#86efac}.card-amber{fill:#fffbeb;stroke:#fbbf24}.label,.small-label{font-size:19px;font-weight:700;fill:#111827}.small-label{font-size:14px;fill:#1f2937}.body{font-size:14px;fill:#374151}.muted{font-size:13px;fill:#64748b}.pill{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.pill-text{font-size:13px;font-weight:700;fill:#1f2937}.arrow-line{stroke:#2563eb;stroke-width:4;stroke-linecap:round}.arrow-head{fill:#2563eb}.thin-arrow-line{stroke:#64748b;stroke-width:2.5;stroke-linecap:round}.thin-arrow-head{fill:#64748b}.rule{fill:#0f172a}.rule-title{font-size:15px;font-weight:700;fill:#fff}.rule-text{font-size:14px;fill:#cbd5e1}</style></defs><rect width="1200" height="700" x="0" y="0" class="bg"/><text x="72" y="62" class="title">OMH keeps Hermes chat, handoff, and evidence in separate lanes</text><text x="72" y="92" class="subtitle">Users ask Hermes in plain language. OMH shapes the workflow without pretending prepared work already ran.</text><rect width="196" height="110" x="72" y="126" class="card" rx="14"/><text x="96" y="160" class="small-label">Plain request</text><text x="96" y="188" class="body">&quot;Can this become</text><text x="96" y="210" class="body">a safe repo change?&quot;</text><line x1="282" x2="318" y1="181" y2="181" class="arrow-line"/><path d="M334 181 L316 171 L316 191 Z" class="arrow-head"/><rect width="204" height="110" x="348" y="126" class="card-blue" rx="14"/><text x="372" y="160" class="small-label">Hermes Agent</text><text x="372" y="188" class="body">Chat intake, memory,</text><text x="372" y="210" class="body">skills, and narration</text><line x1="566" x2="602" y1="181" y2="181" class="arrow-line"/><path d="M618 181 L600 171 L600 191 Z" class="arrow-head"/><rect width="222" height="110" x="632" y="126" class="card-green" rx="14"/><text x="656" y="160" class="small-label">OMH workflow layer</text><text x="656" y="188" class="body">Role, playbook, status,</text><text x="656" y="210" class="body">and evidence boundary</text><line x1="868" x2="904" y1="181" y2="181" class="arrow-line"/><path d="M920 181 L902 171 L902 191 Z" class="arrow-head"/><rect width="194" height="110" x="934" y="126" class="card-amber" rx="14"/><text x="958" y="160" class="small-label">Runtime handoff</text><text x="958" y="188" class="body">Codex, Claude Code,</text><text x="958" y="210" class="body">Hermes, or wrapper</text><rect width="320" height="244" x="72" y="304" class="card-blue" rx="16"/><text x="104" y="344" class="label">Retained by Hermes</text><text x="104" y="370" class="muted">Guide, Researcher, Planner, Operator</text><rect width="238" height="36" x="104" y="398" class="pill" rx="18"/><text x="124" y="421" class="pill-text">route request and ask once</text><rect width="238" height="36" x="104" y="446" class="pill" rx="18"/><text x="124" y="469" class="pill-text">research, plan, or explain fit</text><rect width="238" height="36" x="104" y="494" class="pill" rx="18"/><text x="124" y="517" class="pill-text">show next visible action</text><rect width="320" height="244" x="440" y="304" class="card-green" rx="16"/><text x="472" y="344" class="label">Prepared handoff</text><text x="472" y="370" class="muted">Handoff Guide and Tracker</text><rect width="238" height="36" x="472" y="398" class="pill" rx="18"/><text x="492" y="421" class="pill-text">choose responsible executor</text><rect width="238" height="36" x="472" y="446" class="pill" rx="18"/><text x="492" y="469" class="pill-text">package scope and checks</text><rect width="238" height="36" x="472" y="494" class="pill" rx="18"/><text x="492" y="517" class="pill-text">mark prepared_not_observed</text><rect width="320" height="244" x="808" y="304" class="card-amber" rx="16"/><text x="840" y="344" class="label">Observed evidence</text><text x="840" y="370" class="muted">Reviewer, Tracker, and runtime records</text><rect width="238" height="36" x="840" y="398" class="pill" rx="18"/><text x="860" y="421" class="pill-text">dispatch, result, or artifact</text><rect width="238" height="36" x="840" y="446" class="pill" rx="18"/><text x="860" y="469" class="pill-text">tests, review, CI, readiness</text><rect width="238" height="36" x="840" y="494" class="pill" rx="18"/><text x="860" y="517" class="pill-text">merge or delivery evidence</text><line x1="392" x2="416" y1="426" y2="426" class="thin-arrow-line"/><path d="M432 426 L416 416 L416 436 Z" class="thin-arrow-head"/><line x1="760" x2="784" y1="426" y2="426" class="thin-arrow-line"/><path d="M800 426 L784 416 L784 436 Z" class="thin-arrow-head"/><rect width="1056" height="72" x="72" y="590" class="rule" rx="16"/><text x="104" y="623" class="rule-title">Public claim rule</text><text x="104" y="647" class="rule-text">Prepared handoff != observed execution until a wrapper or runtime records evidence for dispatch, result, verification, review, CI, or merge.</text></svg>