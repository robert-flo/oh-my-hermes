nt-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#c5ccd6">▼ ▼</tspan></text><text x="28" y="459" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#c5ccd6">┌──────────────┐ ┌──────────────┐</tspan></text><text x="28" y="482" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#c5ccd6">│ src/skills │ ─────▶ │ src/quality │</tspan><tspan fill="#e57373"> ─ ─ ▶ coding cycle 2: quality → coding</tspan></text><text x="28" y="505" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#c5ccd6">└──────────────┘ └──────────────┘</tspan></text><text x="28" y="551" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#3a4350">│ </tspan><tspan fill="#c5ccd6">P1 plugin_bundle imports routing.chat for one type</tspan></text><text x="28" y="574" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#3a4350">│ </tspan><tspan fill="#c5ccd6">P1 quality imports coding.fanout to score budgets</tspan></text><text x="28" y="597" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#3a4350">│ </tspan><tspan fill="#c5ccd6">P2 wrapper/contract.py is 1,900 lines</tspan></text><text x="28" y="620" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#3a4350">│ </tspan><tspan fill="#c5ccd6">P3 3 modules re-export instead of own</tspan></text><text x="28" y="666" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#3a4350">│ </tspan><tspan fill="#6b7683">plan, 4 phases, one PR each, tests lock behavior, stops if a lock breaks</tspan></text><text x="28" y="689" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#3a4350">│ </tspan><tspan fill="#6b7683">[x] </tspan><tspan fill="#c5ccd6">1 extract the shared types into src/coding/contracts</tspan></text><text x="28" y="712" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#3a4350">│ </tspan><tspan fill="#63d47f">[•] </tspan><tspan fill="#63d47f">2 point plugin_bundle at that seam; drop the import</tspan></text><text x="28" y="735" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#3a4350">│ </tspan><tspan fill="#6b7683">[ ] </tspan><tspan fill="#c5ccd6">3 move budget scoring out of quality</tspan></text><text x="28" y="758" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#3a4350">│ </tspan><tspan fill="#6b7683">[ ] </tspan><tspan fill="#c5ccd6">4 split wrapper/contract.py by session vs render</tspan></text><text x="28" y="804" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#6b7683">after phase 2 cycles 2 → </tspan><tspan fill="#63d47f">0</tspan><tspan fill="#6b7683"> cross-package imports 17 → </tspan><tspan fill="#63d47f">9</tspan><tspan fill="#6b7683"> tests 9,304 ok</tspan></text><text x="28" y="850" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#5fd4e0">› </tspan><tspan fill="#f4f6f8">▌</tspan></text></svg>