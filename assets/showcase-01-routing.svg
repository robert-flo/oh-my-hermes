<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="493" viewBox="0 0 1100 493"><rect width="1100" height="493" fill="#0b0f14" rx="0"/><text x="28" y="45" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#5fd4e0">› </tspan><tspan fill="#f4f6f8">find every place that references RouteDecision, with file and line</tspan></text><text x="28" y="68" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#3a4350">│ </tspan><tspan fill="#6b7683">route </tspan><tspan fill="#e0b455">standard</tspan><tspan fill="#6b7683"> score +4 exhaustive_search: &quot;every place&quot;</tspan></text><text x="28" y="91" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#3a4350">│ </tspan><tspan fill="#6b7683">lane </tspan><tspan fill="#c5ccd6">unspecified-high → gpt-6-astra xhigh</tspan></text><text x="28" y="114" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#3a4350">│ </tspan><tspan fill="#6b7683">why </tspan><tspan fill="#c5ccd6">this needs full recall; the cheap model misses some</tspan></text><text x="28" y="160" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#5fd4e0">› </tspan><tspan fill="#f4f6f8">rename DEFAULT_RETRY_LIMIT to MAX_RETRY_ATTEMPTS, keep behavior</tspan></text><text x="28" y="183" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#3a4350">│ </tspan><tspan fill="#6b7683">route </tspan><tspan fill="#63d47f">light</tspan><tspan fill="#6b7683"> score -2 simple_request: &quot;rename&quot;</tspan></text><text x="28" y="206" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#3a4350">│ </tspan><tspan fill="#6b7683">lane </tspan><tspan fill="#c5ccd6">quick → glm-5.2-ultrafast low</tspan></text><text x="28" y="229" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#3a4350">│ </tspan><tspan fill="#6b7683">why </tspan><tspan fill="#c5ccd6">a rename; the cheap model gets the same answer</tspan></text><text x="28" y="275" fill="#6b7683" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve">lanes on this machine</text><rect width="68.4" height="19" x="246.4" y="261" fill="#fff" rx="3"/><text x="255.4" y="275" fill="#000" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="bold" xml:space="preserve">OpenAI</text><rect width="85.2" height="19" x="324.8" y="261" fill="#2f7cf6" rx="3"/><text x="333.8" y="275" fill="#fff" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="bold" xml:space="preserve">Z.ai GLM</text><rect width="93.6" height="19" x="420" y="261" fill="#d4a27f" rx="3"/><text x="429" y="275" fill="#1a1a1a" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="bold" xml:space="preserve">Anthropic</text><rect width="127.2" height="19" x="523.6" y="261" fill="#111" rx="3"/><text x="532.6" y="275" fill="#fff" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="bold" xml:space="preserve">Moonshot Kimi</text><text x="28" y="321" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#6b7683">same tasks, same Astra, same answers</tspan></text><text x="28" y="344" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#6b7683">cost Astra alone </tspan><tspan fill="#e57373">████████████████████████</tspan><tspan fill="#c5ccd6"> $4.29</tspan></text><text x="28" y="367" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#6b7683">Astra + OMH </tspan><tspan fill="#63d47f">████░░░░░░░░░░░░░░░░░░░░</tspan><tspan fill="#63d47f"> $0.66 6.5x less</tspan></text><text x="28" y="390" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#6b7683">time Astra alone </tspan><tspan fill="#e57373">████████████████████████</tspan><tspan fill="#c5ccd6"> 23.3 min</tspan></text><text x="28" y="413" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#6b7683">Astra + OMH </tspan><tspan fill="#63d47f">█████░░░░░░░░░░░░░░░░░░░</tspan><tspan fill="#63d47f"> 5.0 min 4.7x faster</tspan></text><text x="28" y="459" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#5fd4e0">› </tspan><tspan fill="#f4f6f8">▌</tspan></text></svg>