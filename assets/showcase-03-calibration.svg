<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="608" viewBox="0 0 1100 608"><rect width="1100" height="608" fill="#0b0f14" rx="0"/><text x="28" y="45" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#5fd4e0">› </tspan><tspan fill="#f4f6f8">hand the parser rewrite to astra</tspan></text><text x="28" y="68" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#3a4350">│ </tspan><tspan fill="#c5ccd6">model gpt-6-astra contract: efforts low..max, floor low, tool calls via Responses API</tspan></text><text x="28" y="91" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#3a4350">│ </tspan><tspan fill="#6b7683">prompt </tspan><tspan fill="#c5ccd6">2 lines added for this model</tspan><tspan fill="#6b7683"> (every family has its own)</tspan></text><text x="28" y="114" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#3a4350">│ </tspan><tspan fill="#c5ccd6"> the numbered criteria are the whole job; nothing outside them is owed</tspan></text><text x="28" y="137" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#3a4350">│ </tspan><tspan fill="#c5ccd6"> ask once, only if a missing input changes the answer; otherwise assume and go</tspan></text><text x="28" y="183" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#6b7683">one block per model family · what each line corrects</tspan></text><text x="28" y="206" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#5fd4e0">gpt </tspan><tspan fill="#c5ccd6">once the key fact is known, act; a passed check stays passed</tspan></text><text x="28" y="229" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#5fd4e0">claude </tspan><tspan fill="#c5ccd6">the checklist is complete; do not add to it mid-run</tspan></text><text x="28" y="252" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#5fd4e0">gemini </tspan><tspan fill="#c5ccd6">a claim with no tool output is not evidence</tspan></text><text x="28" y="275" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#5fd4e0">qwen </tspan><tspan fill="#c5ccd6">no thinking tags; it is a non-thinking coder</tspan></text><text x="28" y="298" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#5fd4e0">deepseek </tspan><tspan fill="#c5ccd6">respect the declared thinking mode; no R1 habits</tspan></text><text x="28" y="321" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#5fd4e0">glm </tspan><tspan fill="#c5ccd6">reason between tool calls only when it changes the next call</tspan></text><text x="28" y="344" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#5fd4e0">kimi </tspan><tspan fill="#c5ccd6">decompose only the hard parts; do the easy ones directly</tspan></text><text x="28" y="367" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#6b7683">+ grok, mistral, llama, codestral, solar, generic</tspan></text><rect width="68.4" height="19" x="44.8" y="399" fill="#fff" rx="3"/><text x="53.8" y="413" fill="#000" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="bold" xml:space="preserve">OpenAI</text><rect width="93.6" height="19" x="123.2" y="399" fill="#d4a27f" rx="3"/><text x="132.2" y="413" fill="#1a1a1a" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="bold" xml:space="preserve">Anthropic</text><rect width="68.4" height="19" x="226.8" y="399" fill="#4285f4" rx="3"/><text x="235.8" y="413" fill="#fff" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="bold" xml:space="preserve">Google</text><rect width="85.2" height="19" x="305.2" y="399" fill="#4d6bfe" rx="3"/><text x="314.2" y="413" fill="#fff" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="bold" xml:space="preserve">DeepSeek</text><rect width="51.6" height="19" x="400.4" y="399" fill="#6f5cf5" rx="3"/><text x="409.4" y="413" fill="#fff" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="bold" xml:space="preserve">Qwen</text><rect width="85.2" height="19" x="462" y="399" fill="#2f7cf6" rx="3"/><text x="471" y="413" fill="#fff" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="bold" xml:space="preserve">Z.ai GLM</text><rect width="127.2" height="19" x="557.2" y="399" fill="#111" rx="3"/><text x="566.2" y="413" fill="#fff" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="bold" xml:space="preserve">Moonshot Kimi</text><rect width="43.2" height="19" x="694.4" y="399" fill="#222" rx="3"/><text x="703.4" y="413" fill="#fff" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="bold" xml:space="preserve">xAI</text><rect width="76.8" height="19" x="747.6" y="399" fill="#ff7000" rx="3"/><text x="756.6" y="413" fill="#111" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="bold" xml:space="preserve">Mistral</text><rect width="102" height="19" x="834.4" y="399" fill="#0866ff" rx="3"/><text x="843.4" y="413" fill="#fff" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="bold" xml:space="preserve">Meta Llama</text><text x="28" y="459" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#6b7683">measured: gpt-6-astra, same 30 tasks, every arm solved 18</tspan></text><text x="28" y="482" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#6b7683">no block </tspan><tspan fill="#c5ccd6">██████████████████████░░</tspan><tspan fill="#c5ccd6"> 1.55M tokens</tspan></text><text x="28" y="505" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#6b7683">first draft </tspan><tspan fill="#e57373">████████████████████████</tspan><tspan fill="#e57373"> 1.68M +10% (kept working on tasks it could not pass)</tspan></text><text x="28" y="528" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#6b7683">shipped block </tspan><tspan fill="#63d47f">██████████████████████░░</tspan><tspan fill="#63d47f"> 1.53M -5% turns</tspan></text><text x="28" y="574" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#5fd4e0">› </tspan><tspan fill="#f4f6f8">▌</tspan></text></svg>