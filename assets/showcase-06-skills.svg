<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="585" viewBox="0 0 1100 585"><rect width="1100" height="585" fill="#0b0f14" rx="0"/><text x="28" y="45" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#5fd4e0">› </tspan><tspan fill="#f4f6f8">/ulw-work ship the settings page: new API, React form, and a release gate</tspan></text><text x="28" y="68" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#3a4350">│ </tspan><tspan fill="#c5ccd6">three lanes: backend, frontend, verification. specialists load per lane.</tspan></text><text x="28" y="91" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#6b7683">└ ▾ Tool calls (</tspan><tspan fill="#6b7683">7</tspan><tspan fill="#6b7683">)</tspan></text><text x="28" y="114" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#5fd4e0">├ ● </tspan><tspan fill="#c5ccd6">Skill View(&quot;omh-backend&quot;)</tspan><tspan fill="#6b7683"> (0.1s)</tspan></text><text x="28" y="137" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#5fd4e0">├ ● </tspan><tspan fill="#c5ccd6">Skill View(&quot;omh-frontend&quot;)</tspan><tspan fill="#6b7683"> (0.1s)</tspan></text><text x="28" y="160" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#5fd4e0">├ ● </tspan><tspan fill="#c5ccd6">Skill View(&quot;omh-design-quality-gate&quot;)</tspan><tspan fill="#6b7683"> (0.1s)</tspan></text><text x="28" y="183" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#5fd4e0">├ ● </tspan><tspan fill="#c5ccd6">Skill View(&quot;omh-verification-gate&quot;)</tspan><tspan fill="#6b7683"> (0.1s)</tspan></text><text x="28" y="206" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#5fd4e0">├ ● </tspan><tspan fill="#c5ccd6">Skill View(&quot;omh-security-safety-review&quot;)</tspan><tspan fill="#6b7683"> (0.1s)</tspan></text><text x="28" y="229" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#5fd4e0">├ ● </tspan><tspan fill="#c5ccd6">Skill View(&quot;omh-performance-goal&quot;)</tspan><tspan fill="#6b7683"> (0.1s)</tspan></text><text x="28" y="252" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#5fd4e0">├ ● </tspan><tspan fill="#c5ccd6">Skill View(&quot;omh-code-review&quot;)</tspan><tspan fill="#6b7683"> (0.1s)</tspan></text><text x="28" y="298" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#3a4350">│ </tspan><tspan fill="#6b7683">lane backend </tspan><tspan fill="#c5ccd6">omh-backend + omh-security-safety-review</tspan><tspan fill="#6b7683"> endpoint shape, migration, auth boundary</tspan></text><text x="28" y="321" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#3a4350">│ </tspan><tspan fill="#6b7683">lane frontend </tspan><tspan fill="#c5ccd6">omh-frontend + omh-design-quality-gate</tspan><tspan fill="#6b7683"> form state, a11y, visual check before the diff lands</tspan></text><text x="28" y="344" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#3a4350">│ </tspan><tspan fill="#6b7683">lane verification </tspan><tspan fill="#c5ccd6">omh-verification-gate + omh-performance-goal</tspan><tspan fill="#6b7683"> the gate the run must pass; one perf budget</tspan></text><text x="28" y="367" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#3a4350">│ </tspan><tspan fill="#6b7683">review </tspan><tspan fill="#c5ccd6">omh-code-review</tspan><tspan fill="#6b7683"> P0–P3 verdicts on the change</tspan></text><text x="28" y="413" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#6b7683">you did not ask for any of these. the request named a frontend, an API, and a gate;</tspan></text><text x="28" y="436" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#6b7683">the matching skills were already in the run. 108 omh-* skills, generated from one catalog.</tspan></text><text x="28" y="482" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#6b7683">a few more: omh-rust omh-native-debugging omh-inference-serving omh-llm-app-dev</tspan></text><text x="28" y="505" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#6b7683">omh-refactor-plan omh-tech-debt-audit omh-reliability-review omh-ops-review</tspan></text><text x="28" y="551" fill="#c5ccd6" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#5fd4e0">› </tspan><tspan fill="#f4f6f8">▌</tspan></text></svg>